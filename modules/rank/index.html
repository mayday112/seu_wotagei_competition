<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try{if(localStorage.getItem("ystage:theme")==="neon"){var h=document.documentElement;h.classList.add("theme-neon");var p=location.pathname.split("/");h.setAttribute("data-page",(p[1]==="m"&&p[2])?p[2].toLowerCase():"home");var a=function(i,u){if(!document.getElementById(i)){var s=document.createElement("link");s.id=i;s.rel="stylesheet";s.href=u;document.head.appendChild(s)}};a("theme-neon-css","/m/component-theme-neon/theme.css");a("theme-neon-layout-css","/m/component-theme-neon/neon-layout.css")}}catch(e){}</script>
    <title>一年加组对战 - 排名</title>
    <link rel="preload" as="image" href="/resource/images/bg_index.jpg" />
    <!-- P11：布局原语（L1 共享资产，origin 相对绝对路径）——先于 style.css，页面样式可覆盖 -->
    <link rel="stylesheet" href="/web/components/grid.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 添加烟花容器 -->
    <div class="firework-container" id="fireworkContainer"></div>

    <div class="container">
      <header>
        <h1 data-i18n="ranking.profRankTitle">一年加组对战 - 最终排名</h1>
        <p class="subtitle" data-i18n="ranking.profSubtitle">双败赛制战况</p>
      </header>
      <main>
        <!-- 第二章节前三名展示区域 -->
        <section id="chapter2-top3">
          <h2 data-i18n="ranking.chapter2Final">第二章节最终排名</h2>
          <div class="top3-container">
            <div class="rank-position rank-silver" data-rank="2">
              <span class="rank-number">2</span>
              <div class="rank-player"></div>
            </div>
            <div class="rank-position rank-gold" data-rank="1">
              <span class="rank-number">1</span>
              <div class="rank-player"></div>
            </div>
            <div class="rank-position rank-bronze" data-rank="3">
              <span class="rank-number">3</span>
              <div class="rank-player"></div>
            </div>
          </div>
        </section>

        <section id="final-winner">
          <h2 data-i18n="ranking.champion">总冠军</h2>
          <div class="champion-display" id="champion-display">
            <p data-i18n="ranking.completeAllNotice">请完成所有章节的比赛</p>
          </div>
        </section>

        <!-- 添加比赛流程图区域 -->
        <section id="tournament-bracket">
          <h2 data-i18n="ranking.bracketSection">第二章节比赛流程</h2>
          <div class="bracket-container" id="bracket-container">
            <div class="loading" data-i18n="ranking.loadingBracket">正在加载比赛数据...</div>
          </div>
        </section>

        <section class="navigation">
          <button id="home-btn" data-i18n="ranking.backHome">回到主页面</button>
          <button id="chapter1-btn" data-i18n="ranking.backChapter1">回到第一章节</button>
          <button id="chapter2-btn" data-i18n="ranking.backChapter2">回到第二章节</button>
        </section>
      </main>
    </div>

    <!-- 前端插件挂载点（rank 页面 UI 绑定既有静态骨架，此节点仅作 kernel 装配锚点） -->
    <div id="plugin-root" hidden></div>
    <script type="module" src="/web/kernel.js"></script>
  </body>
</html>
